plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.shimakaze.azurpromiliavi'
    compileSdk 35

    defaultConfig {
        applicationId "vn.shimakaze.azurpromiliavi"
        minSdk 26
        targetSdk 35
        versionCode 114
        versionName "v1.0.14"
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword "AzurPromiliaVI2026"
            keyAlias "azurvi"
            keyPassword "AzurPromiliaVI2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.core:core:1.13.1'
}
